[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jevscout"
version = "0.2.0"
description = "Modular collection and classification with inspectable local runs"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]==3.2.13"]
crawl = [
    "crawlee[beautifulsoup,httpx]==1.11.0",
    "httpx2==2.16.0",
    "httpcore2==2.16.0",
]

[project.scripts]
jevscout = "jevscout.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
