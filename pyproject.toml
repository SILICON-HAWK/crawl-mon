[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jevscout"
version = "0.1.0"
description = "Modular collection and classification with inspectable local runs"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
jevscout = "jevscout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
